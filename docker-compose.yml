version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrishield_backend
    ports:
      - "8000:8000"
    volumes:
      # Map the local database file directly into the container to persist data
      - ./crop_health.db:/app/crop_health.db
    restart: unless-stopped

  frontend:
    build:
      context: ./Agricultural Officials Dashboard
      dockerfile: Dockerfile
    container_name: agrishield_frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - backend
